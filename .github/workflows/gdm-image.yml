name: GDM image

# Nightly: upstream eneo-ai/vemsa main + our gdm commits -> tests -> ghcr.io/gdmkonsult/vemsa:gdm.
# The rebase is local only: GITHUB_TOKEN may not push upstream's workflow-file changes.
on:
  schedule:
    - cron: "30 0 * * *"
  push:
    branches: [gdm]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gdm-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: vemsa_test
          POSTGRES_USER: vemsa
          POSTGRES_PASSWORD: vemsa-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vemsa -d vemsa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VEMSA_TEST_POSTGRES_URL: postgresql://vemsa:vemsa-test@localhost:5432/vemsa_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Rebase gdm commits onto upstream main
        id: rebase
        run: |
          git config user.name "gdm-bot"
          git config user.email "gdm-bot@users.noreply.github.com"
          git remote add upstream https://github.com/eneo-ai/vemsa.git
          git fetch --quiet upstream main
          if ! git rebase upstream/main; then
            # uv.lock conflicts are expected; it is regenerated below
            [ "$(git diff --name-only --diff-filter=U)" = "uv.lock" ] || { git rebase --abort; exit 1; }
            git checkout --ours uv.lock && git add uv.lock
            GIT_EDITOR=true git rebase --continue
          fi
          uv lock
          grep -q '+cu129' uv.lock || { echo "CUDA 12.9 torch missing from lock"; exit 1; }
          echo "upstream=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - run: uv sync --group dev --group evaluation
      - run: uv run --group evaluation pytest

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            TORCH_VARIANT=gpu
            ML_EXTRAS=diarize align local
          tags: |
            ghcr.io/${{ github.repository }}:gdm
            ghcr.io/${{ github.repository }}:gdm-${{ steps.rebase.outputs.upstream }}-${{ steps.rebase.outputs.head }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            se.gdm.vemsa.upstream=${{ steps.rebase.outputs.upstream }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-gdm
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-gdm,mode=max
